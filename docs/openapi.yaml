openapi: 3.0.3
info:
  title: CodeForge API
  version: 1.0.0
  description: Secure, multi-language code compilation platform API for C, C++, and Rust.
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

paths:
  /health:
    get:
      summary: API Health Check
      responses:
        '200':
          description: Service is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: v1

  /builds:
    post:
      summary: Submit a source file or ZIP project for compilation
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - language
                - standard
              properties:
                file:
                  type: string
                  format: binary
                language:
                  type: string
                  enum: [cpp, c, rust]
                standard:
                  type: string
                  example: c++20
                projectId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Build accepted and enqueued
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /builds/{id}:
    get:
      summary: Get build status and details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Build details
        '404':
          description: Build not found

  /builds/{id}/artifact:
    get:
      summary: Download compiled PE executable (.exe)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary executable stream
          content:
            application/vnd.microsoft.portable-executable:
              schema:
                type: string
                format: binary
        '404':
          description: Artifact or build not found

  /builds/{id}/cancel:
    post:
      summary: Cancel a queued or compiling build
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Build cancelled successfully

  /github/build:
    post:
      summary: Import and build a public GitHub repository
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repository
                - language
                - standard
              properties:
                repository:
                  type: string
                  example: owner/repo
                branch:
                  type: string
                  default: main
                language:
                  type: string
                  enum: [cpp, c, rust]
                standard:
                  type: string
                  example: c++20
                projectId:
                  type: string
      responses:
        '202':
          description: Repository fetched and build enqueued

  /projects:
    get:
      summary: List user projects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user projects
    post:
      summary: Create a new project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                defaultLanguage:
                  type: string
                  enum: [cpp, c, rust]
      responses:
        '201':
          description: Project created

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
